name: "📚 Documentation Issue"
description: Something in the docs is missing, wrong or confusing.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: issue-type
    attributes:
      multiple: false
      label: What kind of documentation issue is this?
      options:
        - Something is wrong or out of date
        - Something is missing
        - Something is correct but confusing
      default: 0
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where?
      description: The file, page or section; a link is ideal.
      placeholder: README.md, docs/..., or apps/opencv/public/llms.txt
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What it says now, and what it should say.
    validations:
      required: true
